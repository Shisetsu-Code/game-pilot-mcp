name: Verify Game Pilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash -n scripts/wireguard-up.sh && bash -n scripts/wireguard-down.sh
      - run: node --test test/wireguard.test.js test/launcher.test.js
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --only-shell chromium
      - name: Verify browser dependencies
        run: |
          if ! node --input-type=module -e "import {chromium} from 'playwright'; const b=await chromium.launch({headless:true}); await b.close();"; then
            npx playwright install-deps chromium
          fi
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: npx wrangler deploy --dry-run --outdir artifacts/worker
