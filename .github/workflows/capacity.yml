name: Browser capacity benchmark
on:
  workflow_dispatch:
    inputs:
      wait_ms:
        description: Simulated idle time between operations (0 to 5000 ms)
        default: '2000'
        required: true
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node scripts/benchmark-capacity.mjs
        env:
          PILOT_BENCH_WAIT_MS: ${{ inputs.wait_ms }}
